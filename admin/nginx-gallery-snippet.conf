# Paste these TWO location blocks inside the existing Merope-C `server {}` block.
# Only gallery reads are public. No admin API endpoint is exposed via nginx.
location = /api/gallery {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8765/api/gallery;
    proxy_set_header Host $host;
}
location /uploads/ {
    alias /var/www/merope-c/uploads/;
    add_header X-Content-Type-Options nosniff always;
    autoindex off;
}
