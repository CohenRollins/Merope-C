# Place inside Merope-C's existing nginx server {} block for LAN testing only.
# This restricts media API access to the server and Windows ICS LAN.
# If your subnet differs, change it before installation.
# DO NOT remove these restrictions without adding an authentication layer and HTTPS.
location ^~ /api/media/ {
    allow 127.0.0.1;
    allow 192.168.137.0/24;
    deny all;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_buffering off;
    proxy_read_timeout 180s;
    add_header X-Content-Type-Options nosniff always;
}
