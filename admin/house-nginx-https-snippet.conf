# Add only to an Nginx server block already serving the domain over HTTPS.
# Install a valid HTTPS certificate first. Never forward the resident API over HTTP.
location /house-api/ {
    limit_except GET POST { deny all; }
    client_max_body_size 16m;  # Browser uploads one photo per request, up to 10 MB raw
    proxy_pass http://127.0.0.1:8767/house-api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
